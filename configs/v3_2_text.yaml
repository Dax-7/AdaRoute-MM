runtime:
  experiment_version: v3_2_text

models:
  router_small:
    model_name: qwen2.5:1.5b-instruct-q4_1
  qwen_small:
    model_name: qwen2.5:1.5b-instruct-q4_1

vlm:
  enabled: false
  skip_if_no_image: true
  cache_enabled: false

router:
  enabled: true
  default_difficulty: middle_ok
  allowed_labels:
    - small_ok
    - middle_ok
    - large_required
  risk_gate:
    enabled: true
    static_only: true
    default_label: middle_ok
    allowed_labels:
      - small_ok
      - middle_ok
      - large_required
    answer_type_routes:
      numeric: large_required
    source_routes:
      meta-math/GSM8K_zh: large_required
      ucinlp/drop: large_required
      mib-bench/arc_challenge: middle_ok
    dynamic_sources:
      allenai/sciq:
        default_label: middle_ok
        allowed_labels:
          - small_ok
          - middle_ok
      mib-bench/arc_easy:
        default_label: middle_ok
        allowed_labels:
          - small_ok
          - middle_ok

routing:
  policies:
    difficulty_based:
      simple: qwen_small
      medium: phi3_medium
      hard: gemma_large

fallback:
  enabled: false
  quality_checks:
    min_chars: 1
    uncertainty_keywords: []

cache:
  enabled: false
  cache_vlm: false
  cache_router: false
  cache_llm: false
